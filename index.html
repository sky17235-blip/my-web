<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧樞紐現勘系統 (Tech Edition v5)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 科技實體風格 (Dark Tech / Neumorphism) */
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #2b2b36;
            --text-main: #e0e0e0;
            --accent-cyan: #00f0ff;
            --accent-green: #39ff14;
            --accent-purple: #b366ff;
            --shadow-light: rgba(255, 255, 255, 0.05);
            --shadow-dark: rgba(0, 0, 0, 0.6);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 80px;
        }

        .app-header {
            background: linear-gradient(145deg, #1a1a1f, #24242b);
            box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
            color: var(--accent-cyan);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #333;
        }

        .nav-tabs {
            border-bottom: none;
            background: var(--bg-color);
            padding: 10px 5px 0 5px;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }

        .nav-tabs::-webkit-scrollbar { display: none; }

        .nav-link {
            background: var(--panel-bg);
            color: #888;
            border: none;
            border-radius: 8px 8px 0 0;
            margin-right: 5px;
            box-shadow: inset 2px 2px 5px var(--shadow-light), inset -2px -2px 5px var(--shadow-dark);
        }

        .nav-link.active {
            background: var(--bg-color);
            color: var(--accent-cyan) !important;
            border-top: 2px solid var(--accent-cyan);
            border-bottom: 2px solid var(--bg-color);
            box-shadow: none;
        }

        .tab-content { padding: 20px 15px; }

        .tech-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            border: 1px solid #3a3a45;
        }

        .section-title {
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-cyan);
            padding-left: 10px;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }

        .form-label { font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }

        .form-control, .form-select {
            background-color: #1a1a1f !important;
            color: var(--accent-green) !important;
            border: 1px solid #444;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            font-family: monospace;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .form-control:disabled {
            background-color: #222 !important;
            color: #555 !important;
            box-shadow: none;
        }

        /* 檔案上傳按鈕樣式客製化 */
        input[type="file"]::file-selector-button {
            background: #333;
            color: var(--accent-cyan);
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            margin-right: 10px;
            cursor: pointer;
        }

        .qty-group {
            display: flex; align-items: center; background: #1a1a1f;
            border-radius: 6px; padding: 5px;
            box-shadow: inset 2px 2px 5px var(--shadow-dark);
        }
        .qty-label { flex-grow: 1; font-size: 0.85rem; color: #ccc; }
        .qty-input { width: 55px; text-align: center; border: none; background: #222; color: var(--accent-green); font-weight: bold; }

        .btn-tech {
            background: linear-gradient(145deg, #007780, #005f66);
            color: white; border: none; border-radius: 8px; padding: 12px;
            font-weight: bold; letter-spacing: 1px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
            transition: all 0.2s ease; width: 100%;
        }

        .btn-tech:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
            transform: scale(0.98);
        }

        #map { height: 250px; border-radius: 8px; border: 2px solid #444; margin-bottom: 15px; z-index: 1; }

        .form-check-input { background-color: #333; border-color: #555; }
        .form-check-input:checked {
            background-color: var(--accent-cyan); border-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }
        
        .cat-title { 
            font-size: 0.95rem; font-weight: bold; color: var(--accent-purple); 
            border-bottom: 1px dashed #555; padding-bottom: 5px; 
            margin-top: 15px; margin-bottom: 10px; 
        }
    </style>
</head>
<body>

    <div class="app-header d-flex justify-content-between align-items-center">
        <h5 class="m-0 fw-bold"><i class="fas fa-satellite-dish"></i> SMART HUB SURVEY <span style="font-size: 0.5em; color: #888;">v5.0</span></h5>
        <span class="badge bg-secondary text-light" id="gps-status">等待定位</span>
    </div>

    <ul class="nav nav-tabs shadow-sm" id="surveyTabs" role="tablist">
        <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#location">1. 空間環境</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#hardware">2. 設施硬體</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#devices">3. 附掛服務</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="location">
            <div class="tech-card">
                <div class="section-title"><i class="fas fa-map-marked-alt"></i> 空間定位</div>
                <div id="map"></div>
                <button class="btn-tech mb-3" onclick="getLocation()">
			<i class="fas fa-crosshairs"></i> 擷取當前 GPS 座標
		</button>
                <div class="row g-2">
                    <div class="col-6"><label class="form-label">緯度 (Latitude)</label><input type="number" step="any" id="lat" class="form-control"></div>
                    <div class="col-6"><label class="form-label">經度 (Longitude)</label><input type="number" step="any" id="lng" class="form-control"></div>
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title"><i class="fas fa-road"></i> 環境與路口特性</div>
                <div class="mb-3">
                    <label class="form-label">路口特性</label>
                    <select class="form-select" id="intersection_type">
                        <option>一般路側</option><option>雙叉</option><option>三叉</option><option>四叉或四叉以上</option><option>死路</option><option>圓環</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">地形地物概述</label>
                    <select class="form-select" id="terrain">
                        <option value="1">平坦無礙</option>
                        <option value="2">高低起伏 (坡度>6%)</option>
                        <option value="3">左右急彎 (彎道視距<40m)</option>
                    </select>
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title"><i class="fas fa-exclamation-triangle"></i> 過去事件機率評估</div>
                <div class="row g-2">
                    <script>
                        const events = [
                            {id: 'prob_crash', label: '車禍機率'}, {id: 'prob_acc', label: '意外機率'},
                            {id: 'prob_fog', label: '濃霧機率'}, {id: 'prob_tour', label: '觀光人流熱區'},
                            {id: 'prob_pop', label: '人口常住密度'}, {id: 'prob_speed', label: '車速易超過速限'}
                        ];
                        const options = ['極高', '高', '普通', '低', '極低'];
                        events.forEach(ev => {
                            document.write(`
                                <div class="col-6">
                                    <label class="form-label">${ev.label}</label>
                                    <select class="form-select prob-select" id="${ev.id}">
                                        ${options.map((opt, i) => `<option value="${5-i}" ${i===2?'selected':''}>${opt}</option>`).join('')}
                                    </select>
                                </div>
                            `);
                        });
                    </script>
                </div>
            </div>
            
            <div class="tech-card">
                <div class="section-title"><i class="fas fa-bolt"></i> 所屬迴路控制箱</div>
                <div class="row g-2 mb-2">
                    <div class="col-12"><label class="form-label">控制箱編號</label><input type="text" class="form-control"></div>
                    <div class="col-6"><label class="form-label">控制箱緯度</label><input type="number" step="any" class="form-control"></div>
                    <div class="col-6"><label class="form-label">控制箱經度</label><input type="number" step="any" class="form-control"></div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="hardware">
            
            <div class="tech-card" style="border-color: var(--accent-green);">
                <div class="section-title text-success"><i class="fas fa-camera"></i> 現場與草圖拍攝</div>
                <div class="mb-3">
                    <label class="form-label">現場照片 (可多選/連續拍攝)</label>
                    <input type="file" class="form-control" accept="image/*" capture="environment" multiple>
                </div>
                <div class="mb-2">
                    <label class="form-label">環境設計草圖</label>
                    <input type="file" class="form-control" accept="image/*" capture="environment">
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title"><i class="fas fa-layer-group"></i> 本體結構參數</div>
                <div class="row g-3 mb-3">
                    <div class="col-12"><label class="form-label">路燈編號</label><input type="text" class="form-control"></div>
                    
                    <div class="col-12">
                        <label class="form-label">高度選擇</label>
                        <select class="form-select" id="pole_height_select" onchange="handleHeightChange()">
                            <option value="">請選擇高度</option>
                            <option value="3-4">3-4 公尺</option>
                            <option value="6-8">6-8 公尺</option>
                            <option value="10-12">10-12 公尺</option>
                            <option value="other">其他 (需填寫)</option>
                        </select>
                        <input type="number" step="0.1" id="custom_pole_height" class="form-control mt-2 d-none" placeholder="輸入高度 (公尺)" oninput="handleHeightChange()">
                    </div>

                    <div class="col-6"><label class="form-label">直徑 (cm)</label><input type="number" class="form-control"></div>
                    <div class="col-6"><label class="form-label">管厚 (mm)</label><input type="number" step="0.1" class="form-control"></div>
                    <div class="col-6"><label class="form-label">線徑 (mm²)</label><input type="number" step="0.1" class="form-control"></div>
                    <div class="col-6"><label class="form-label">燈具盞數</label><input type="number" class="form-control" value="1" min="0"></div>
                    <div class="col-6"><label class="form-label">延伸臂數</label><input type="number" class="form-control" value="1" min="0"></div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-warning"><i class="fas fa-calculator"></i> 基礎結構自動換算 (連江縣標準)</label>
                    <textarea id="foundation_spec" class="form-control text-info" rows="3" readonly style="font-size: 0.85rem; background: #111 !important; line-height: 1.5;"></textarea>
                </div>

                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label">管道狀態</label>
                        <select class="form-select"><option>暢通</option><option>敗管</option></select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">基礎是否能承重</label>
                        <select class="form-select" id="base_strength"><option value="high">原址安裝</option><option value="low">重新安裝</option></select>
                    </div>
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title"><i class="fas fa-network-wired"></i> 電力與網路配置</div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">電力來源</label>
                        <select class="form-select">
                            <option>台電</option><option>綠能 (風電)</option><option>綠能 (太陽能)</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">網路來源</label>
                        <select class="form-select">
                            <option>有線 (光纜)</option><option>有線 (電纜)</option>
                            <option>無線 (4/5G)</option><option>無線 (Sub-1G)</option><option>無</option>
                        </select>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">纜線附掛方式</label>
                    <select class="form-select"><option>既有管道</option><option>邊溝</option><option>架空</option><option>無</option></select>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="devices">
            <div class="tech-card">
                <div class="section-title"><i class="fas fa-microchip"></i> 附掛裝置盤點 (填寫數量)</div>
                <div class="row g-2">
                    <script>
                        const hwList = ['燈控', '攝影機', '感測器', '數位看板', '可變式資訊看板', '鄰里廣播', '基地台', 'WiFi AP', '天線', '警示燈', '設備箱'];
                        hwList.forEach(dev => {
                            document.write(`
                                <div class="col-6 col-md-4">
                                    <div class="qty-group"><span class="qty-label">${dev}</span><input type="number" class="qty-input device-qty" value="0" min="0"></div>
                                </div>
                            `);
                        });
                    </script>
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title"><i class="fas fa-project-diagram"></i> 適合未來應用服務 (可複選)</div>
                
                <div class="cat-title"><i class="fas fa-traffic-light"></i> 政府：智慧路口</div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gov" type="checkbox"><label class="form-check-label text-light">行人穿越預警</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gov" type="checkbox"><label class="form-check-label text-light">行車死角預警</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gov" type="checkbox"><label class="form-check-label text-light">超速預警</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gov" type="checkbox"><label class="form-check-label text-light">濃霧預警</label></div></div>
                </div>

                <div class="cat-title"><i class="fas fa-shield-alt"></i> 政府：智慧安全</div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gov" type="checkbox"><label class="form-check-label text-light">人車流分析</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gov" type="checkbox"><label class="form-check-label text-light">路口監視</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gov" type="checkbox"><label class="form-check-label text-light">車牌辨識</label></div></div>
                </div>

                <div class="cat-title"><i class="fas fa-leaf"></i> 綠能：韌性電網</div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gre" type="checkbox"><label class="form-check-label text-light">微型風電</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gre" type="checkbox"><label class="form-check-label text-light">垂直太陽能</label></div></div>
                    
                    <div class="col-12"><div class="form-check"><input class="form-check-input srv-gre toggle-input" type="checkbox" data-target="road1"><label class="form-check-label text-light">光電牆</label></div>
                        <input type="text" id="road1" class="form-control form-control-sm mt-1" placeholder="需填寫路段" disabled></div>
                    <div class="col-12"><div class="form-check"><input class="form-check-input srv-gre toggle-input" type="checkbox" data-target="road2"><label class="form-check-label text-light">風力牆</label></div>
                        <input type="text" id="road2" class="form-control form-control-sm mt-1" placeholder="需填寫路段" disabled></div>
                    <div class="col-12"><div class="form-check"><input class="form-check-input srv-gre toggle-input" type="checkbox" data-target="road3"><label class="form-check-label text-light">太陽能步道</label></div>
                        <input type="text" id="road3" class="form-control form-control-sm mt-1" placeholder="需填寫路段" disabled></div>
                </div>

                <div class="cat-title"><i class="fas fa-medkit"></i> 綠能：緊災應變</div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gre" type="checkbox"><label class="form-check-label text-light">鄰近防空住所</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gre" type="checkbox"><label class="form-check-label text-light">鄰近學校</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gre" type="checkbox"><label class="form-check-label text-light">鄰近醫院</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-gre" type="checkbox"><label class="form-check-label text-light">鄰近老人安養</label></div></div>
                </div>

                <div class="cat-title"><i class="fas fa-car"></i> 出行：MaaS</div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-maas" type="checkbox"><label class="form-check-label text-light">機車換電站</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-maas" type="checkbox"><label class="form-check-label text-light">慢充：220VAC</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-maas" type="checkbox"><label class="form-check-label text-light">快充：380VAC</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-maas" type="checkbox"><label class="form-check-label text-light">Kiosk</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-maas" type="checkbox"><label class="form-check-label text-light">車船整合</label></div></div>
                </div>

                <div class="cat-title"><i class="fas fa-wifi"></i> 通訊：共構共享</div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-com" type="checkbox"><label class="form-check-label text-light">物聯網</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-com" type="checkbox"><label class="form-check-label text-light">5G PicoCell</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-com" type="checkbox"><label class="form-check-label text-light">WiFi</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-com" type="checkbox"><label class="form-check-label text-light">低軌衛星</label></div></div>
                </div>

                <div class="cat-title"><i class="fas fa-tv"></i> 吸睛：DOOH</div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-dooh" type="checkbox"><label class="form-check-label text-light">膽固醇面板</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-dooh" type="checkbox"><label class="form-check-label text-light">數位看板</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-dooh" type="checkbox"><label class="form-check-label text-light">看板租賃機器人</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-dooh" type="checkbox"><label class="form-check-label text-light">AR/VR導覽</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-dooh" type="checkbox"><label class="form-check-label text-light">城市整合行銷</label></div></div>
                </div>

                <div class="cat-title"><i class="fas fa-plane"></i> 低空：DaaS</div>
                <div class="row g-2 mb-3">
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-daas" type="checkbox"><label class="form-check-label text-light">無人機巡航</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input srv-daas" type="checkbox"><label class="form-check-label text-light">無人機物流</label></div></div>
                </div>

                <button class="btn-tech mt-3" onclick="calculatePriority()"><i class="fas fa-cogs"></i> 執行科學選址計算</button>
                <div id="result-box" class="alert alert-dark mt-3 d-none" style="border: 1px solid var(--accent-cyan); background: #121212;"></div>
            </div>
        </div>
    </div>
<div class="mt-4">
    <button class="btn btn-success w-100 shadow-sm" onclick="saveAndExport()">
        <i class="fas fa-file-download"></i> 儲存現勘結果並匯出 CSV
    </button>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. 地圖初始化 (Leaflet) ---
        let map, marker;
        function initMap(lat = 26.1517, lng = 119.9397) { // 預設馬祖南竿
            if(map) { map.remove(); }
            map = L.map('map').setView([lat, lng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([lat, lng], {draggable: true}).addTo(map);
            marker.on('dragend', function(e) {
                const pos = marker.getLatLng();
                document.getElementById('lat').value = pos.lat.toFixed(6);
                document.getElementById('lng').value = pos.lng.toFixed(6);
            });
            setTimeout(() => { map.invalidateSize(); }, 500);
        }

        document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(tab => {
            tab.addEventListener('shown.bs.tab', function (e) {
                if(e.target.getAttribute('data-bs-target') === '#location') { if(map) map.invalidateSize(); }
            });
        });
        window.onload = () => { initMap(); };

        // --- GPS 定位 ---
        function getLocation() {
            const badge = document.getElementById("gps-status");
            if (navigator.geolocation) {
                badge.innerText = "定位中...";
                badge.className = "badge bg-warning text-dark";
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        document.getElementById("lat").value = lat.toFixed(6);
                        document.getElementById("lng").value = lng.toFixed(6);
                        initMap(lat, lng);
                        badge.innerText = `精度: ±${position.coords.accuracy.toFixed(0)}m`;
                        badge.className = "badge bg-success text-white";
                    },
                    function(error) {
                        alert("獲取 GPS 失敗，請確認裝置權限。");
                        badge.innerText = "定位失敗";
                        badge.className = "badge bg-danger text-white";
                    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        // --- 高度選單切換處理 (連江縣基礎結構判斷) ---
        function handleHeightChange() {
            const selectVal = document.getElementById('pole_height_select').value;
            const customInput = document.getElementById('custom_pole_height');
            const display = document.getElementById('foundation_spec');
            
            if (selectVal === 'other') {
                customInput.classList.remove('d-none');
                display.value = "非標準高度，需專案結構技師特殊評估";
            } else {
                customInput.classList.add('d-none');
                customInput.value = '';
                
                if (selectVal === "3-4") {
                    display.value = "基礎埋設深度：0.8-1.0公尺\n基座寬度：0.5x0.5公尺\n鋼筋混凝土強度：210kg/cm²\n適用場景：人行道、公園燈";
                } else if (selectVal === "6-8") {
                    display.value = "基礎埋設深度：1.2-1.5公尺\n基座寬度：0.7x0.7公尺\n鋼筋混凝土強度：210kg/cm²\n適用場景：市區次要道路、巷弄";
                } else if (selectVal === "10-12") {
                    display.value = "基礎埋設深度：1.8-2.2公尺\n基座寬度：1.0x1.0公尺\n鋼筋混凝土強度：245kg/cm²\n適用場景：主幹道、環島公路";
                } else {
                    display.value = "請選擇路燈高度以換算基礎結構...";
                }
            }
        }

        // --- 處理「需填寫路段」的輸入框開關 ---
        document.querySelectorAll('.toggle-input').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const targetId = this.getAttribute('data-target');
                const inputField = document.getElementById(targetId);
                if(this.checked) {
                    inputField.disabled = false;
                    inputField.focus();
                } else {
                    inputField.disabled = true;
                    inputField.value = '';
                }
            });
        });

        // --- 優先權計算邏輯 ---
        function calculatePriority() {
            // 抓取各模組被選取的數量來當基礎分數
            const sumGov = document.querySelectorAll('.srv-gov:checked').length;
            const sumGre = document.querySelectorAll('.srv-gre:checked').length;
            const sumMaaS = document.querySelectorAll('.srv-maas:checked').length;
            const sumCom = document.querySelectorAll('.srv-com:checked').length;
            const sumDooh = document.querySelectorAll('.srv-dooh:checked').length;
            const sumDaas = document.querySelectorAll('.srv-daas:checked').length;

            let baseScore = (sumGov * 20) + (sumGre * 15) + (sumMaaS * 12) + (sumCom * 12) + (sumDooh * 8) + (sumDaas * 10);

            // 環境與事件機率加權 (1~5，數值越大機率越高)
            const pCrash = parseInt(document.getElementById('prob_crash').value);
            const pAcc = parseInt(document.getElementById('prob_acc').value);
            const pFog = parseInt(document.getElementById('prob_fog').value);
            const pTour = parseInt(document.getElementById('prob_tour').value);
            const pSpeed = parseInt(document.getElementById('prob_speed').value);
            const terrain = parseInt(document.getElementById('terrain').value);

            let envMultiplier = 1.0;
            if (terrain > 1) envMultiplier += 0.1;
            if (pCrash >= 4 || pAcc >= 4 || pSpeed >= 4) envMultiplier += 0.2;
            if (pFog >= 4) envMultiplier += 0.15;
            if (pTour >= 4) envMultiplier += 0.1;

            // 基礎設施阻力扣減
            const baseStrength = document.getElementById('base_strength').value;
            let constructPenalty = (baseStrength === 'low') ? 15 : 0;

            // 總分計算與標準化
            let finalScore = (baseScore * envMultiplier) - constructPenalty;
            finalScore = Math.max(0, Math.min(100, Math.round(finalScore * 0.45 + 20))); 

            const resultBox = document.getElementById('result-box');
            resultBox.classList.remove('d-none');
            resultBox.innerHTML = `
                <h6 class="text-info text-center fw-bold mb-3">多維度選址分析報告</h6>
                <div style="font-size: 2.5rem; color: var(--accent-cyan); text-align: center; text-shadow: 0 0 10px rgba(0,240,255,0.5);">
                    ${finalScore} <span style="font-size: 1rem; color: #aaa;">/ 100 PTS</span>
                </div>
                <hr style="border-color: #444;">
                <ul style="font-size: 0.85rem; color: #ccc; line-height: 1.8;">
                    <li>事件機率增幅係數：<span class="text-warning">+${Math.round((envMultiplier-1)*100)}%</span> (安防與地形加權)</li>
                    <li>基礎施工阻力扣除：<span class="text-danger">-${constructPenalty}</span> 分</li>
                </ul>
            `;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        //
        function saveAndExport() {
    try {
        // 1. 抓取基本資訊
        const lat = document.getElementById('lat').value;
        const lng = document.getElementById('lng').value;
        const currentTime = new Date().toLocaleString();
        
        if (!lat || !lng) {
            alert("⚠️ 錯誤：請先擷取 GPS 座標再行匯出。");
            return;
        }

        // 2. 建立 CSV 內容 (加上 \ufeff 避免 Excel 中文亂碼)
        let csvContent = "\ufeff項目,內容\n";
        csvContent += `現勘時間,${currentTime}\n`;
        csvContent += `GPS 緯度,${lat}\n`;
        csvContent += `GPS 經度,${lng}\n`;
        csvContent += `路口特性,${document.getElementById('intersection_type').value}\n`;

        // 3. 自動搜尋所有輸入數量大於 0 的設備
        // 假設你的輸入框 class 是 qty-input 或 device-qty
        const inputs = document.querySelectorAll('.qty-input, .device-qty');
        let deviceCount = 0;
        
        inputs.forEach(input => {
            const val = parseInt(input.value);
            if (val > 0) {
                // 尋找該輸入框對應的名稱 (label)
                const group = input.closest('.qty-group');
                const label = group ? group.querySelector('.qty-label').innerText : "未知設備";
                csvContent += `${label},${val}\n`;
                deviceCount++;
            }
        });

        // 4. 執行下載動作 (針對手機 WebView 優化)
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const reader = new FileReader();
        
        reader.onload = function(e) {
            const link = document.createElement("a");
            const timestamp = new Date().getTime();
            link.href = e.target.result;
            link.download = `現勘報告_${timestamp}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            alert(`✅ 成功匯出！共記錄 ${deviceCount} 項設備。檔案已儲存至下載資料夾。`);
        };
        
        reader.readAsDataURL(blob);

    } catch (error) {
        console.error(error);
        alert("匯出失敗，請檢查輸入內容是否有誤。");
    }
}
    </script>
</body>
</html>
