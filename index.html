<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧樞紐現勘系統 (Tech Edition)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* 科技實體風格 (Dark Tech / Neumorphism) */
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #2b2b36;
            --text-main: #e0e0e0;
            --accent-cyan: #00f0ff;
            --accent-green: #39ff14;
            --shadow-light: rgba(255, 255, 255, 0.05);
            --shadow-dark: rgba(0, 0, 0, 0.6);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 80px;
        }

        .app-header {
            background: linear-gradient(145deg, #1a1a1f, #24242b);
            box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
            color: var(--accent-cyan);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #333;
        }

        .nav-tabs {
            border-bottom: none;
            background: var(--bg-color);
            padding: 10px 5px 0 5px;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }

        .nav-tabs::-webkit-scrollbar { display: none; }

        .nav-link {
            background: var(--panel-bg);
            color: #888;
            border: none;
            border-radius: 8px 8px 0 0;
            margin-right: 5px;
            box-shadow: inset 2px 2px 5px var(--shadow-light), inset -2px -2px 5px var(--shadow-dark);
        }

        .nav-link.active {
            background: var(--bg-color);
            color: var(--accent-cyan) !important;
            border-top: 2px solid var(--accent-cyan);
            border-bottom: 2px solid var(--bg-color);
            box-shadow: none;
        }

        .tab-content {
            padding: 20px 15px;
        }

        /* 實體感卡片與輸入框 */
        .tech-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            border: 1px solid #3a3a45;
        }

        .section-title {
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-cyan);
            padding-left: 10px;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }

        .form-label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .form-control, .form-select {
            background-color: #1a1a1f !important;
            color: var(--accent-green) !important;
            border: 1px solid #444;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            font-family: monospace;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        /* 硬體數量專用控制 */
        .qty-group {
            display: flex;
            align-items: center;
            background: #1a1a1f;
            border-radius: 6px;
            padding: 5px;
            box-shadow: inset 2px 2px 5px var(--shadow-dark);
        }
        .qty-label { flex-grow: 1; font-size: 0.9rem; color: #ccc; }
        .qty-input { width: 60px; text-align: center; border: none; background: #222; color: var(--accent-green); font-weight: bold; }

        /* 按鈕設計 */
        .btn-tech {
            background: linear-gradient(145deg, #007780, #005f66);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-tech:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
            transform: scale(0.98);
        }

        #map {
            height: 250px;
            border-radius: 8px;
            border: 2px solid #444;
            margin-bottom: 15px;
            z-index: 1;
        }

        /* 複選框與單選框客製化 */
        .form-check-input {
            background-color: #333;
            border-color: #555;
        }
        .form-check-input:checked {
            background-color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="app-header d-flex justify-content-between align-items-center">
        <h5 class="m-0 fw-bold">SMART HUB SURVEY <span style="font-size: 0.6em; color: #888;">v2.0</span></h5>
        <span class="badge bg-secondary text-light" id="gps-status">等待定位</span>
    </div>

    <ul class="nav nav-tabs shadow-sm" id="surveyTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#location">1. 位置與環境</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#hardware">2. 路燈硬體</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#devices">3. 智慧附掛與服務</button>
        </li>
    </ul>

    <div class="tab-content">
        
        <div class="tab-pane fade show active" id="location">
            <div class="tech-card">
                <div class="section-title">地理空間定位 (Map)</div>
                <div id="map"></div>
                <button class="btn-tech mb-3" onclick="getLocation()">
                    <i class="fas fa-satellite"></i> 擷取當前 GPS 座標
                </button>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">緯度 (Latitude)</label>
                        <input type="number" step="any" id="lat" class="form-control" placeholder="25.xxxx">
                    </div>
                    <div class="col-6">
                        <label class="form-label">經度 (Longitude)</label>
                        <input type="number" step="any" id="lng" class="form-control" placeholder="121.xxxx">
                    </div>
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title">所屬迴路控制箱</div>
                <div class="row g-2 mb-2">
                    <div class="col-12">
                        <label class="form-label">控制箱編號</label>
                        <input type="text" class="form-control" placeholder="輸入台電或市府編號">
                    </div>
                    <div class="col-6">
                        <label class="form-label">控制箱緯度</label>
                        <input type="number" step="any" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="form-label">控制箱經度</label>
                        <input type="number" step="any" class="form-control">
                    </div>
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title">環境風險與事件</div>
                <div class="mb-3">
                    <label class="form-label">週遭地形地物概述</label>
                    <select class="form-select" id="terrain">
                        <option value="1">平坦無礙</option>
                        <option value="2">高低起伏</option>
                        <option value="3">左右急彎 / 視線死角</option>
                    </select>
                </div>
                <label class="form-label">過去事件紀錄 (可複選)</label>
                <div class="row g-2">
                    <div class="col-4"><div class="form-check"><input class="form-check-input risk-event" type="checkbox" value="car_crash"><label class="form-check-label text-light">車禍</label></div></div>
                    <div class="col-4"><div class="form-check"><input class="form-check-input risk-event" type="checkbox" value="accident"><label class="form-check-label text-light">意外</label></div></div>
                    <div class="col-4"><div class="form-check"><input class="form-check-input risk-event" type="checkbox" value="fog"><label class="form-check-label text-light">濃霧</label></div></div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="hardware">
            <div class="tech-card">
                <div class="section-title">本體結構參數</div>
                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <label class="form-label">路燈編號</label>
                        <input type="text" class="form-control" placeholder="P-XXXXXX">
                    </div>
                    <div class="col-6">
                        <label class="form-label">高度 (m)</label>
                        <input type="number" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="form-label">直徑 (cm)</label>
                        <input type="number" class="form-control">
                    </div>
                    <div class="col-4">
                        <label class="form-label">燈具盞數</label>
                        <input type="number" class="form-control" value="1" min="0">
                    </div>
                    <div class="col-4">
                        <label class="form-label">延伸臂數</label>
                        <input type="number" class="form-control" value="1" min="0">
                    </div>
                    <div class="col-4">
                        <label class="form-label">線徑 (mm²)</label>
                        <input type="number" class="form-control" placeholder="例如: 5.5">
                    </div>
                </div>
                
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label">管道狀態</label>
                        <select class="form-select">
                            <option>暢通</option>
                            <option>敗管 (需重拉)</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">基礎承重評估</label>
                        <select class="form-select" id="base_strength">
                            <option value="high">原址安裝 (承重足夠)</option>
                            <option value="low">重新安裝 (需補強)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title">基礎管線佈局</div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">電力來源</label>
                        <div class="form-check"><input class="form-check-input" type="radio" name="power" checked><label class="form-check-label text-light">台電市電</label></div>
                        <div class="form-check"><input class="form-check-input" type="radio" name="power"><label class="form-check-label text-light">綠能 (風電/太陽能)</label></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label">網路來源</label>
                        <div class="form-check"><input class="form-check-input" type="radio" name="network" checked><label class="form-check-label text-light">有線光纖</label></div>
                        <div class="form-check"><input class="form-check-input" type="radio" name="network"><label class="form-check-label text-light">無線通訊</label></div>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">纜線附掛方式</label>
                    <select class="form-select">
                        <option>既有管道 (地下化)</option>
                        <option>依附邊溝</option>
                        <option>架空明線</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="devices">
            <div class="tech-card">
                <div class="section-title">附掛裝置盤點 (填寫數量)</div>
                <div class="row g-2">
                    <script>
                        const devices = ['燈控器', '攝影機', '各類感測器', '數位看板(CMS)', '可變式看板(VMS)', '鄰里廣播喇叭', '通訊基地台', 'Wi-Fi AP', '各類天線'];
                        devices.forEach(dev => {
                            document.write(`
                                <div class="col-12 col-md-6">
                                    <div class="qty-group">
                                        <span class="qty-label">${dev}</span>
                                        <input type="number" class="qty-input form-control device-qty" value="0" min="0">
                                    </div>
                                </div>
                            `);
                        });
                    </script>
                </div>
            </div>

            <div class="tech-card">
                <div class="section-title">適合應用服務 (優先權計算基礎)</div>
                <div class="row g-2 mb-3">
                    <div class="col-6"><div class="form-check"><input class="form-check-input req-gov" type="checkbox" value="1"><label class="form-check-label text-light">智慧安全 (安防)</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input req-gov" type="checkbox" value="1"><label class="form-check-label text-light">緊急應變</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input req-gre" type="checkbox" value="1"><label class="form-check-label text-info fw-bold">綠能韌性 (風/光)</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input req-com" type="checkbox" value="1"><label class="form-check-label text-light">通訊中繼</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input req-tra" type="checkbox" value="1"><label class="form-check-label text-light">出行 (換電/車聯網)</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input req-tou" type="checkbox" value="1"><label class="form-check-label text-light">智慧路口</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input req-tou" type="checkbox" value="1"><label class="form-check-label text-light">DOOH 廣告</label></div></div>
                    <div class="col-6"><div class="form-check"><input class="form-check-input req-tou" type="checkbox" value="1"><label class="form-check-label text-light">低空經濟節點</label></div></div>
                </div>
                
                <button class="btn-tech mt-3" onclick="calculatePriority()">
                    <i class="fas fa-microchip"></i> 執行科學選址計算
                </button>
                
                <div id="result-box" class="alert alert-dark mt-3 d-none" style="border: 1px solid var(--accent-cyan); background: #121212;">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. 地圖初始化 (Leaflet) ---
        let map, marker;
        
        function initMap(lat = 25.0330, lng = 121.5654) { // 預設台北 101
            if(map) { map.remove(); }
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            
            marker = L.marker([lat, lng], {draggable: true}).addTo(map);
            
            // 拖動標記更新經緯度輸入框
            marker.on('dragend', function(e) {
                const pos = marker.getLatLng();
                document.getElementById('lat').value = pos.lat.toFixed(6);
                document.getElementById('lng').value = pos.lng.toFixed(6);
            });
            
            // 修正 Bootstrap Tab 隱藏時載入地圖造成的破圖問題
            setTimeout(() => { map.invalidateSize(); }, 500);
        }

        // 當切換到「位置與環境」標籤時，確保地圖正確渲染
        document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(tab => {
            tab.addEventListener('shown.bs.tab', function (event) {
                if(event.target.getAttribute('data-bs-target') === '#location') {
                    if(map) map.invalidateSize();
                }
            });
        });

        // 頁面載入時初始化
        window.onload = () => { initMap(); };

        // --- 2. GPS 定位 [cite: 135] ---
        function getLocation() {
            const badge = document.getElementById("gps-status");
            if (navigator.geolocation) {
                badge.innerText = "定位中...";
                badge.className = "badge bg-warning text-dark";
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        document.getElementById("lat").value = lat.toFixed(6);
                        document.getElementById("lng").value = lng.toFixed(6);
                        
                        // 更新地圖
                        initMap(lat, lng);
                        
                        badge.innerText = `精度: ±${position.coords.accuracy.toFixed(0)}m`;
                        badge.className = "badge bg-success text-white";
                    },
                    function(error) {
                        alert("獲取 GPS 失敗，請確認裝置權限。");
                        badge.innerText = "定位失敗";
                        badge.className = "badge bg-danger text-white";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                alert("此瀏覽器不支援地理定位。");
            }
        }

        // --- 3. 優先權計算 (整合馬祖版權重邏輯) [cite: 326] ---
        function calculatePriority() {
            // 權重設定 (依循高優次序：Gov > Gre > Com > Tra > Tou)
            const W_Gov = 35, W_Gre = 25, W_Com = 20, W_Tra = 12, W_Tou = 8;
            
            // 取得各類需求被勾選的數量
            const sumGov = document.querySelectorAll('.req-gov:checked').length;
            const sumGre = document.querySelectorAll('.req-gre:checked').length;
            const sumCom = document.querySelectorAll('.req-com:checked').length;
            const sumTra = document.querySelectorAll('.req-tra:checked').length;
            const sumTou = document.querySelectorAll('.req-tou:checked').length;

            // 計算服務基礎分數
            let baseScore = (sumGov * W_Gov) + (sumGre * W_Gre) + (sumCom * W_Com) + (sumTra * W_Tra) + (sumTou * W_Tou);

            // 環境風險與事件加權 (結合危險地形與車禍等事件)
            let envMultiplier = 1.0;
            const terrain = parseInt(document.getElementById('terrain').value);
            const events = document.querySelectorAll('.risk-event:checked').length;
            
            // 若地形險惡(急彎)或有濃霧/車禍紀錄，政府安全需求(Gov)的急迫性應大幅上升
            if (terrain === 3) envMultiplier += 0.2; 
            if (events > 0) envMultiplier += (events * 0.15);
            
            // 基礎硬體扣減 (若基礎需重新安裝，阻力增加，稍微降低實行優先度)
            const baseStrength = document.getElementById('base_strength').value;
            let constructPenalty = 0;
            if (baseStrength === 'low') {
                constructPenalty = 15;
            }

            // 計算最終分數 (滿分機制標準化)
            let finalScore = (baseScore * envMultiplier) - constructPenalty;
            
            // 將分數標準化至 0-100 區間
            finalScore = Math.max(0, Math.min(100, Math.round(finalScore * 0.5 + 20))); 

            // 計算裝置總數
            let totalDevices = 0;
            document.querySelectorAll('.device-qty').forEach(el => totalDevices += parseInt(el.value || 0));

            // 顯示結果
            const resultBox = document.getElementById('result-box');
            resultBox.classList.remove('d-none');
            resultBox.innerHTML = `
                <h6 class="text-info text-center fw-bold mb-3">綜合選址分析報告</h6>
                <div style="font-size: 2.5rem; color: var(--accent-cyan); text-align: center; text-shadow: 0 0 10px rgba(0,240,255,0.5);">
                    ${finalScore} <span style="font-size: 1rem; color: #aaa;">/ 100 PTS</span>
                </div>
                <hr style="border-color: #444;">
                <ul style="font-size: 0.85rem; color: #ccc; line-height: 1.8;">
                    <li>規劃附掛設備總數：<span class="text-warning">${totalDevices}</span> 組</li>
                    <li>環境風險增幅係數：<span class="text-danger">+${Math.round((envMultiplier-1)*100)}%</span> (安全建置急迫性)</li>
                    <li>基礎施工阻力扣除：<span class="text-danger">-${constructPenalty}</span> 分</li>
                </ul>
                <div class="text-center mt-2" style="font-size: 0.8rem; color: var(--accent-green);">
                    [ 數據已暫存，請接續同步至 Quantum 雲端樞紐 ]
                </div>
            `;
            
            // 自動滾動到底部查看結果
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
